[package]
name = "truehd-atmos-ffi"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "C-callable Dolby TrueHD / Atmos (object presentation) decoder for Apple platforms, built on the truehd crate"
publish = false
rust-version = "1.88"

[lib]
name = "truehd_atmos"
# staticlib is what the xcframework ships; rlib lets the Rust tests and examples link it.
crate-type = ["staticlib", "rlib"]

[dependencies]
# truehdd workspace, library crate only. Pinned to an exact commit so a rebuild decodes
# exactly what was verified; bump deliberately and re-run the harness.
# The fork is upstream main (02d29cd) plus truehdd/truehdd#42, which sizes the block and PCM
# buffers to the samples they hold (byte-identical output, about 30% less decode time); back to
# upstream once it is merged.
truehd = { git = "https://github.com/superuser404notfound/truehdd", rev = "9adbb4a71442bf74fccde3b6259b33933ca779e5", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
# Unwinding stays on: every exported function catches panics at the FFI boundary.
panic = "unwind"
incremental = false

[profile.dev]
# The decoder is too slow unoptimised to run the sample tests in reasonable time.
opt-level = 2

[dev-dependencies]
anyhow = "1.0"
